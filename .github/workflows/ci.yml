name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.100
          cache: true
          cache-dependency-path: Source/RimPipe.Tests/RimPipe.Tests.csproj

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build RimPipe (Debug)
        run: dotnet build Source/RimPipe/RimPipe.csproj --configuration Debug -v:minimal -p:OutputPath=$env:RUNNER_TEMP/rimpipe_debug -p:AppendTargetFrameworkToOutputPath=false

      - name: Build RimPipe (Release)
        run: dotnet build Source/RimPipe/RimPipe.csproj --configuration Release -v:minimal -p:OutputPath=$env:RUNNER_TEMP/rimpipe_release -p:AppendTargetFrameworkToOutputPath=false

      - name: Verify deterministic Release build
        shell: pwsh
        run: |
          dotnet build Source/RimPipe/RimPipe.csproj --configuration Release -v:minimal -t:Rebuild -p:OutputPath=$env:RUNNER_TEMP/rimpipe_a -p:AppendTargetFrameworkToOutputPath=false
          dotnet build Source/RimPipe/RimPipe.csproj --configuration Release -v:minimal -t:Rebuild -p:OutputPath=$env:RUNNER_TEMP/rimpipe_b -p:AppendTargetFrameworkToOutputPath=false
          $hashA = (Get-FileHash "$env:RUNNER_TEMP/rimpipe_a/RimPipe.dll").Hash
          $hashB = (Get-FileHash "$env:RUNNER_TEMP/rimpipe_b/RimPipe.dll").Hash
          if ($hashA -ne $hashB) {
            Write-Host "hashA=$hashA"
            Write-Host "hashB=$hashB"
            throw "Deterministic build check failed: same source produced different DLL bytes"
          }

      - name: Verify committed DLL consistency
        shell: pwsh
        run: |
          $committed = (Get-FileHash "Assemblies/RimPipe.dll").Hash
          $built = (Get-FileHash "$env:RUNNER_TEMP/rimpipe_a/RimPipe.dll").Hash
          if ($committed -ne $built) {
            Write-Host "committed=$committed"
            Write-Host "built    =$built"
            throw "Committed Assemblies/RimPipe.dll differs from CI Release build. Rebuild with tools/rebuild-dll.ps1 using the pinned SDK and commit separately."
          }

      - name: Run unit tests
        run: dotnet test Source/RimPipe.Tests/RimPipe.Tests.csproj --configuration Debug -v:minimal

      - name: Validate XML / DefOf / localization
        run: python tools/validate_config.py
